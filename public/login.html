<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – Quiz</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    body, html {
      height:100%; margin:0;
      background: linear-gradient(135deg,#6e8efb,#a777e3);
      color:#fff;
    }
  </style>
</head>
<body class="d-flex vh-100">
  <div class="container d-flex flex-column justify-content-center align-items-center">
    <h1 class="mb-4">Connexion</h1>
    <form id="authForm" class="w-100" style="max-width:320px;" data-action="/login">
      <input type="hidden" id="redirectInput" name="redirect">
      <div class="mb-3">
        <input id="username" name="username" type="text"
               class="form-control" placeholder="Pseudo" required>
      </div>
      <div class="mb-3">
        <input id="password" name="password" type="password"
               class="form-control" placeholder="Mot de passe" required>
      </div>
      <button type="submit"
              class="btn btn-light w-100 mb-3">
        Se connecter
      </button>
      <button id="guestBtn" type="button"
              class="btn btn-outline-light w-100 mb-3">
        Connexion en tant qu’invité
      </button>
    </form>
    <p>
      Pas de compte ?
      <a id="toRegister" href="/register" class="text-light">Inscription</a>
    </p>
  </div>
  <div id="toastContainer"
       class="position-fixed top-0 end-0 p-3"
       style="z-index:1055"></div>
  <script src="auth.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
